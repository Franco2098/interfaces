<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="POST">
        <h1 id="titulo">Formulario</h1>
            <label id="label1" for="nombre">Nombre:</label>
            <input type="text" id="nombre">
            <hr>
            <label id="label2" for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos">
            <hr>
            <label id="label3" for="sexo">Sexo:</label>
            <input type="radio" id="hombre" name="sexo" value="hombre"> Hombre
            <input type="radio" id="mujer" name="sexo" value="mujer"> Mujer
            <hr>
            <label id="label4" for="mail">e-mail:</label>
            <input type="text" id="mail">
            <hr>
            <label id="label5" for="nick">Nick:</label>
            <input type="text" id="nick">
            <hr>
            <label id="label6" for="comentario">Comentario:</label>
            <textarea name="comentario" id="comentario"></textarea>
            <hr>
        <button id="submit" type="submit">Enviar</button>
        <button id="reset" type="reset">Reset</button>
    </form>
    <script src="script/script.js"></script>
</body>

</html>
